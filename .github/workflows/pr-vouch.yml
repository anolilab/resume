name: "PR Vouch"

# Labels each pull request with how much its author is trusted: `vouch:trusted`
# (collaborator, bot or listed in `.github/VOUCHED.td`), `vouch:unvouched` or
# `vouch:denounced`. It labels only; nothing is blocked. The work is done by the
# shared `vouch` workflow, which checks nothing out.
on: # yamllint disable-line rule:truthy
    pull_request_target:
        types:
            - "opened"
            - "reopened"
            - "synchronize"
            - "ready_for_review"

concurrency:
    group: "${{ github.workflow }}-${{ github.event.pull_request.number }}"
    cancel-in-progress: true

permissions: {}

jobs:
    vouch:
        permissions:
            contents: "read"
            issues: "write" # to create the labels
            pull-requests: "write" # to apply them
        uses: "anolilab/workflows/.github/workflows/vouch.yml@7d2d854c2e366a63e7c7b243d83145e8b5cd98b1" # v26.0.4
        with:
            target-repo: "anolilab/resume"
