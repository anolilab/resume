name: "AlloAllo"

on: # yamllint disable-line rule:truthy
    issues:
        types:
            - "opened"
    pull_request_target:
        branches:
            - "main"
        types:
            - "opened"
            - "closed"

permissions:
    contents: "read" # to read the repository
    issues: "write" # for the shared workflow to comment on and label issues
    pull-requests: "write" # for the shared workflow to comment on and label pull requests

jobs:
    allo-allo:
        uses: "anolilab/workflows/.github/workflows/allo-allo.yml@e484b4e5e086f12f0f4c02ba62988aed49f69a6d" # v25.0.6 # main
        with:
            target-repo: "anolilab/resume"
            onboarding-lead: "prisis"
