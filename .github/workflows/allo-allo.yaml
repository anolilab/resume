name: "AlloAllo"

on: # yamllint disable-line rule:truthy
    issues:
        types:
            - "opened"
    pull_request_target:
        branches:
            - "main"
        types:
            - "opened"
            - "closed"

permissions:
    contents: "read" # to read the repository
    issues: "write" # for the shared workflow to comment on and label issues
    pull-requests: "write" # for the shared workflow to comment on and label pull requests

jobs:
    allo-allo:
        uses: "anolilab/workflows/.github/workflows/allo-allo.yml@ad133c06463ecade56b67dd20a793ed89cb1ae33" # v26.0.10 # main
        with:
            target-repo: "anolilab/resume"
            onboarding-lead: "prisis"
