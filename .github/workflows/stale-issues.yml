name: "Label Idle Issues"

on: # yamllint disable-line rule:truthy
    schedule:
        - cron: "0 0 * * *"

permissions:
    contents: "read" # to read the repository
    issues: "write" # for the shared workflow to comment on and label issues
    pull-requests: "write" # for the shared workflow to comment on and label pull requests

jobs:
    stale-issues:
        uses: "anolilab/workflows/.github/workflows/stale-issues.yml@13fa35fefde7f2ad64dbaa108f6421ae3062d711" # v18.0.4 # main
        with:
            target-repo: "anolilab/resume"
