name: "CodeQL"
on: # yamllint disable-line rule:truthy
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]
    schedule:
        - cron: "0 0 * * 1"
permissions: {}
jobs:
    codeql:
        permissions:
            security-events: "write"
            actions: "read"
            contents: "read"
        uses: "anolilab/workflows/.github/workflows/codeql.yml@e484b4e5e086f12f0f4c02ba62988aed49f69a6d" # v25.0.6
        with:
            languages: "[\"javascript-typescript\"]"
            branches: "[\"main\"]"
