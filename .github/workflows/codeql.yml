name: "CodeQL"
on: # yamllint disable-line rule:truthy
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]
    schedule:
        - cron: "0 0 * * 1"
permissions: {}
jobs:
    codeql:
        permissions:
            security-events: "write"
            actions: "read"
            contents: "read"
        uses: "anolilab/workflows/.github/workflows/codeql.yml@76fa179df6611c539ec8d5161f867a0e9b7138de" # v26.0.7
        with:
            languages: "[\"javascript-typescript\"]"
            branches: "[\"main\"]"
