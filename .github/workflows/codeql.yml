name: "CodeQL"
on: # yamllint disable-line rule:truthy
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]
    schedule:
        - cron: "0 0 * * 1"
permissions: {}
jobs:
    codeql:
        permissions:
            security-events: "write"
            actions: "read"
            contents: "read"
        uses: "anolilab/workflows/.github/workflows/codeql.yml@382cb6ceef0cc355d67ce923e0173ac7d4a9d135" # v24.0.8
        with:
            languages: "[\"javascript-typescript\"]"
            branches: "[\"main\"]"
