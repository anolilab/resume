name: "CodeQL"
on: # yamllint disable-line rule:truthy
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]
    schedule:
        - cron: "0 0 * * 1"
permissions: {}
jobs:
    codeql:
        permissions:
            security-events: "write"
            actions: "read"
            contents: "read"
        uses: "anolilab/workflows/.github/workflows/codeql.yml@b338ef3e3435901b0368f00f8d7d414b0c59a51b" # v24.0.10
        with:
            languages: "[\"javascript-typescript\"]"
            branches: "[\"main\"]"
