name: "CodeQL"
on: # yamllint disable-line rule:truthy
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]
    schedule:
        - cron: "0 0 * * 1"
permissions: {}
jobs:
    codeql:
        permissions:
            security-events: "write"
            actions: "read"
            contents: "read"
        uses: "anolilab/workflows/.github/workflows/codeql.yml@ad133c06463ecade56b67dd20a793ed89cb1ae33" # v26.0.10
        with:
            languages: "[\"javascript-typescript\"]"
            branches: "[\"main\"]"
