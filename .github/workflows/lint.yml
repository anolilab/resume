name: "Lint"
on: # yamllint disable-line rule:truthy
    pull_request:
        branches: ["main"]
permissions: {}
jobs:
    lint:
        permissions:
            contents: "read"
            pull-requests: "read"
        uses: "anolilab/workflows/.github/workflows/lint.yml@e484b4e5e086f12f0f4c02ba62988aed49f69a6d" # v25.0.6
        with:
            lint_eslint: true
            lint_types: false
            lint_attw: false
            lint_package_json: false
            lint_markdown: false
            lint_yaml: true
            lint_actionlint: false
            lint_rust: false
            node_version: "22"
