name: "Lint"
on: # yamllint disable-line rule:truthy
    pull_request:
        branches: ["main"]
permissions: {}
jobs:
    lint:
        permissions:
            contents: "read"
            pull-requests: "read"
        uses: "anolilab/workflows/.github/workflows/lint.yml@76fa179df6611c539ec8d5161f867a0e9b7138de" # v26.0.7
        with:
            lint_eslint: true
            lint_types: false
            lint_attw: false
            lint_package_json: false
            lint_markdown: false
            lint_yaml: true
            lint_actionlint: false
            lint_rust: false
            node_version: "22"
